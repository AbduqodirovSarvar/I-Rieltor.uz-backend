# The presentation page's host (PRESENTATION_SERVER_NAME): static files of the "presentation" container (root docker-compose.yml).

set $presentation_upstream http://presentation:80;

location / {
    limit_req zone=web_per_ip burst=60 nodelay;
    proxy_pass $presentation_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

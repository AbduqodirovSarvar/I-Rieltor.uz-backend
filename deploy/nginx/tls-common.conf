# TLS and security headers of every HTTPS host (https.conf and vhost-https.conf.template). One certificate covers all hosts:
# certbot asks for SERVER_NAME, ADMIN_SERVER_NAME and PRESENTATION_SERVER_NAME together (deploy/certbot/renew.sh), and
# /etc/nginx/site/cert points at /etc/letsencrypt/live/<SERVER_NAME> (run-nginx.sh).

ssl_certificate     /etc/nginx/site/cert/fullchain.pem;
ssl_certificate_key /etc/nginx/site/cert/privkey.pem;

# Mozilla "intermediate": TLS 1.2 and 1.3 with forward-secret AEAD ciphers only.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# T-28: browsers use HTTPS only for this host for a year after the first visit. Without includeSubDomains:
# other subdomains may not serve HTTPS yet. Only sent here, over a valid certificate.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# HIT, MISS, STALE... for pages the site lets Nginx keep (empty, so not sent, for everything else).
add_header X-Cache-Status $upstream_cache_status always;

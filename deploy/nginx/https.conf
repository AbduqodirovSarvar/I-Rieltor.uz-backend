# The public site's host (and any host without its own block) once the certificate exists: port 80 answers only the
# Let's Encrypt challenge (renewals) and redirects everything else to HTTPS. /etc/nginx/site/cert points at /etc/letsencrypt/live/<SERVER_NAME> (run-nginx.sh).
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log main_with_id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log main_with_id;

    include /opt/nginx/tls-common.conf;
    include /opt/nginx/proxy-locations.conf;
}

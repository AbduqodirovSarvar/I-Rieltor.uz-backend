# Once the certificate exists: port 80 answers only the Let's Encrypt challenge (renewals) and redirects
# everything else to HTTPS. /etc/nginx/site/cert points at /etc/letsencrypt/live/<SERVER_NAME> (run-nginx.sh).
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log main_with_id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log main_with_id;

    ssl_certificate     /etc/nginx/site/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/site/cert/privkey.pem;

    # Mozilla "intermediate": TLS 1.2 and 1.3 with forward-secret AEAD ciphers only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # T-28: browsers use HTTPS only for this host for a year after the first visit. Without includeSubDomains:
    # other subdomains may not serve HTTPS yet. Only sent here, over a valid certificate.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /opt/nginx/proxy-locations.conf;
}

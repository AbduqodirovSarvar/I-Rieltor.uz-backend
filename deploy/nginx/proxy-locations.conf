# The public site's host (SERVER_NAME): the API under /api, /hubs, /uploads, /health, /swagger, and the site for everything else.
# Shared by http-only.conf and https.conf.

include /opt/nginx/api-locations.conf;

# The public site (I-rieltor.uz-web, server-rendered pages and its files). Resolved per request, so an API-only deployment
# without the web service still starts (the site's own addresses then answer 502).
set $web_upstream http://web:4000;

# Everything else is the public site. It sets its own caching and security headers (CSP, cache policy per page); the three
# that this server also adds are taken from Nginx only, so they are not sent twice.
location / {
    limit_req zone=web_per_ip burst=60 nodelay;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_cache web_cache;
    proxy_cache_key $scheme$host$request_uri;
    # One request fills a missing page; the others wait for it. A stale copy is served while a fresh one is fetched, and
    # when the site is down or slow.
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;

    proxy_read_timeout 30s;
}

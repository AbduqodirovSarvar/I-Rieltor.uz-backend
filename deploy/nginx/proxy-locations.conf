# Shared by http-only.conf and https.conf.

set $api_upstream http://api:8080;

# Uploaded images: a page with many of them would use up the per-IP burst; they are static and cheap.
location /uploads/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
}

# Live auctions (SignalR): long-lived connections. The hub sends a ping every 15 s, so a quiet auction is not cut off,
# but the default 60 s read timeout would cut any connection that missed a few pings; an hour is generous.
location /hubs/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location / {
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    # One hop: the API (ForwardLimit = 1) takes this value as the client. It replaces whatever the client sent,
    # so nobody can choose their own IP. If another proxy (e.g. a CDN) is added in front, use
    # $proxy_add_x_forwarded_for and trust that proxy as well.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 60s;
}

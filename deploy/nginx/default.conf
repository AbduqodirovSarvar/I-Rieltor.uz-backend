# Reverse proxy in front of the API container (docker-compose.yml). TLS ends here (T-32):
# certbot (deploy/certbot/renew.sh) gets a Let's Encrypt certificate for SERVER_NAME, and run-nginx.sh switches
# from http-only.conf to https.conf as soon as it exists (and reloads on every renewal).
# The API learns the original scheme from X-Forwarded-Proto.

server_tokens off;

# $request_id goes to the API as X-Request-ID, so this log and the API logs share one id per request.
log_format main_with_id '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" rt=$request_time id=$request_id';

# Per client IP, in front of the API's own limits: floods are cut here, cheaply.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
# The public site: a page brings dozens of files, so more room than the API.
limit_req_zone $binary_remote_addr zone=web_per_ip:10m rate=30r/s;
limit_req_status 429;

# Public pages of the site, kept for as long as the site itself says (Cache-Control: s-maxage=60 on public pages, nothing for
# personal pages and errors), so a burst of visitors reaches the Node server once a minute per page, not once per visitor.
proxy_cache_path /var/cache/nginx/web levels=1:2 keys_zone=web_cache:10m max_size=200m inactive=10m use_temp_path=off;

gzip on;
# text/html is always compressed once gzip is on; listing it again only makes Nginx warn.
gzip_types application/json application/problem+json text/plain text/css text/javascript application/javascript application/xml image/svg+xml;
gzip_min_length 1024;

# WebSocket upgrade for SignalR (live auctions, P2-05).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's DNS, asked again every 10 s: a recreated API container gets a new IP, and a name resolved
# only once at startup would keep pointing at the old one (502 until Nginx restarts).
resolver 127.0.0.11 valid=10s ipv6=off;

# FileStorage:MaxFileSizeMb is 20; a little more for the multipart form around the file.
client_max_body_size 25m;

# http-only.conf or https.conf, chosen by run-nginx.sh.
include /etc/nginx/site/active.conf;

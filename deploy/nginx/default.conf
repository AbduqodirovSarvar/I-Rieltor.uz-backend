# Reverse proxy in front of the API container (docker-compose.yml).
# TLS: either terminate it here (listen 443 ssl + certificates, then enable HSTS below) or in front of
# this container; in both cases the API learns the original scheme from X-Forwarded-Proto.

# WebSocket upgrade for SignalR (live auctions, P2-05).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker's DNS, asked again every 10 s: a recreated API container gets a new IP, and a name resolved
    # only once at startup would keep pointing at the old one (502 until Nginx restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # FileStorage:MaxFileSizeMb is 20; a little more for the multipart form around the file.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # only once served over HTTPS

    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # One hop: the API (ForwardLimit = 1) takes this value as the client. It replaces whatever the client sent,
        # so nobody can choose their own IP. If another proxy (e.g. a CDN) is added in front, use
        # $proxy_add_x_forwarded_for and trust that proxy as well.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }
}

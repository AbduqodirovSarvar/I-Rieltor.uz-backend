# Until certbot has a certificate (first start, or SERVER_NAME / LETSENCRYPT_EMAIL not set, e.g. on a developer
# machine): plain HTTP, so the API works and Let's Encrypt can reach the challenge files.
server {
    listen 80;
    server_name _;
    # In the server block: at http level it would be written in addition to nginx.conf's own access_log.
    access_log /var/log/nginx/access.log main_with_id;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HIT, MISS, STALE... for pages the site lets Nginx keep (empty, so not sent, for everything else).
    add_header X-Cache-Status $upstream_cache_status always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /opt/nginx/proxy-locations.conf;
}

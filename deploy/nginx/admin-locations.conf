# The admin panel's host (ADMIN_SERVER_NAME). The API goes straight to the API container (same limits and the real client
# address as on the site); everything else is the admin container's static files. The admin container sets its own CSP and
# caching; the three headers this server adds too are taken from Nginx only, so they are not sent twice.

include /opt/nginx/api-locations.conf;

set $admin_upstream http://admin:80;

location / {
    limit_req zone=web_per_ip burst=60 nodelay;
    proxy_pass $admin_upstream;
    proxy_http_version 1.1;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    proxy_read_timeout 30s;
}

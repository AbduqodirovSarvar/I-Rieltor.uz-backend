# Build, tests (unit + integration with Testcontainers: the GitHub runner has Docker), migration check and the
# Docker image build. Runs for every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Exactly the package versions of the committed packages.lock.json files.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        # Microsoft.Testing.Platform (global.json)
        run: dotnet test --no-build -c Release

      # The model and the migrations must agree: a change without its migration would stop the app at start.
      - name: Migrations are up to date
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          dotnet ef migrations has-pending-model-changes -p Persistence -s WebApi --no-build --configuration Release
        env:
          # Design-time only; nothing connects to it.
          ConnectionStrings__PostgreSqlConnection: Host=localhost;Database=ci;Username=ci;Password=ci
          JWTConfiguration__Secret: ci-only-secret-ci-only-secret-0123456789

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f WebApi/Dockerfile -t irieltor-api:ci .

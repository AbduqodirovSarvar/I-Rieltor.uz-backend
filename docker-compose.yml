# I-Rieltor.uz backend: API + PostgreSQL + Redis behind Nginx.
#
#   1. cp .env.example .env   and fill in the values, including POSTGRES_PASSWORD and REDIS_PASSWORD
#   2. docker compose up -d --build
#   3. http://localhost (or HTTP_PORT); the API applies its migrations and seeds SUPER_ADMIN on start
#
# Only Nginx is published. PostgreSQL and Redis stay inside the "backend" network; uncomment their
# "ports" lines (bound to 127.0.0.1) to reach them from the host, e.g. for "dotnet ef" or a DB client.
# E-IMZO-SERVER is not part of this file: point Eimzo__BaseUrl in .env at the server that runs it.

name: irieltor

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-IRieltor}
      POSTGRES_USER: ${POSTGRES_USER:-irieltor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # ports:
    #   - "127.0.0.1:5432:5432"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Only a cache: nothing is persisted, and the API keeps working (from the database) while Redis is down.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    # ports:
    #   - "127.0.0.1:6379:6379"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    image: irieltor-api
    restart: unless-stopped
    # Secrets and settings (JWT, SMTP, E-IMZO, CORS, DefaultAdmin, ...) come from .env;
    # the values below override the ones that differ inside this network.
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSqlConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-IRieltor};Username=${POSTGRES_USER:-irieltor};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      FileStorage__RootPath: /data/files
      # X-Forwarded-For is trusted from the Nginx container only (fixed address below).
      ForwardedHeaders__KnownProxies__0: 172.30.0.10
      ForwardedHeaders__KnownNetworks__0: ""
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      backend:
        ipv4_address: 172.30.0.10

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  files:

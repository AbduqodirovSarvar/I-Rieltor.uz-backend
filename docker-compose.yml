# I-Rieltor.uz backend: API + PostgreSQL + Redis behind Nginx.
#
#   1. cp .env.example .env   and fill in the values, including POSTGRES_PASSWORD and REDIS_PASSWORD;
#      then  chmod 600 .env  (it holds every secret)
#   2. docker compose up -d --build
#   3. http://localhost (or HTTP_PORT); the API applies its migrations and seeds SUPER_ADMIN on start
#
# HTTPS (T-32): set SERVER_NAME (the API's domain, DNS pointing at this server) and LETSENCRYPT_EMAIL in .env,
# open ports 80 and 443. certbot gets the certificate within a minute or two and Nginx switches to HTTPS by itself;
# until then (and on a developer machine without those values) Nginx serves plain HTTP.
#
# Backups (T-33): the "backup" service writes a database dump and a files archive every day to BACKUP_DIR
# (default ./backups on this server). See README for restoring. Copy that folder to another machine too:
# a backup on the same disk does not survive the loss of the server.
#
# Only Nginx is published. PostgreSQL and Redis stay inside the "backend" network; uncomment their
# "ports" lines (bound to 127.0.0.1) to reach them from the host, e.g. for "dotnet ef" or a DB client.
# E-IMZO-SERVER is not part of this file: point Eimzo__BaseUrl in .env at the server that runs it.
#
# Images are pinned by digest, so a rebuild gets exactly the tested image. To update one: docker pull <name:tag>,
# then put the new digest from  docker image inspect --format '{{index .RepoDigests 0}}' <name:tag>  here.

name: irieltor

# Container logs are rotated (default json-file logs grow until the disk is full).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-IRieltor}
      POSTGRES_USER: ${POSTGRES_USER:-irieltor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # ports:
    #   - "127.0.0.1:5432:5432"
    networks:
      - backend

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    logging: *default-logging
    # Only a cache: nothing is persisted, and the API keeps working (from the database) while Redis is down.
    # The password goes into a config file readable only by the redis user, not onto the command line,
    # where every user of the host would see it in the process list.
    command:
      - sh
      - -c
      - umask 077 && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf && chown redis:redis /tmp/redis.conf && exec docker-entrypoint.sh redis-server /tmp/redis.conf --save '' --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      # REDISCLI_AUTH instead of -a: the password stays off the command line here too.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    # ports:
    #   - "127.0.0.1:6379:6379"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    image: irieltor-api
    restart: unless-stopped
    logging: *default-logging
    # Secrets and settings (JWT, SMTP, E-IMZO, CORS, DefaultAdmin, ...) come from .env;
    # the values below override the ones that differ inside this network.
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSqlConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-IRieltor};Username=${POSTGRES_USER:-irieltor};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      FileStorage__RootPath: /data/files
      # X-Forwarded-For is trusted from the Nginx container only (fixed address below).
      ForwardedHeaders__KnownProxies__0: 172.30.0.10
      ForwardedHeaders__KnownNetworks__0: ""
    volumes:
      - files:/data/files
    # The runtime image has no curl: the app probes its own /health/ready (WebApi/Extensions/HealthProbe.cs).
    healthcheck:
      test: ["CMD", "dotnet", "WebApi.dll", "--healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    logging: *default-logging
    ports:
      # IPv4 only: Docker forwards IPv6 clients through docker-proxy, and they would all reach Nginx as the
      # gateway address, sharing one rate-limit bucket. Serve IPv6 by enabling IPv6 on the network instead.
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-}
    # Chooses HTTP or HTTPS by whether the certificate exists, and reloads when certbot renews it.
    entrypoint: ["/bin/sh", "/opt/nginx/run-nginx.sh"]
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx:/opt/nginx:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.30.0.10

  # The admin panel (../I-Rieltor.uz-admin): static files plus a proxy to the API, so it is one origin and needs no CORS.
  # http://localhost:${ADMIN_PORT:-8081}. For HTTPS, put it behind the same kind of certificate setup as the API.
  admin:
    build:
      context: ../I-Rieltor.uz-admin
    image: irieltor-admin
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "0.0.0.0:${ADMIN_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    logging: *default-logging
    # Not /opt/certbot: the image keeps certbot itself there.
    entrypoint: ["/bin/sh", "/opt/renew/renew.sh"]
    environment:
      SERVER_NAME: ${SERVER_NAME:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    volumes:
      - ./deploy/certbot:/opt/renew:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - backend

  backup:
    # Same image as the database, so pg_dump matches the server version.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-IRieltor}
      POSTGRES_USER: ${POSTGRES_USER:-irieltor}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-22:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup:/opt/backup:ro
      - files:/data/files:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # Unhealthy (visible in "docker compose ps") when no complete backup was made in the last 26 hours.
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups/last-success -mmin -1560 2>/dev/null)\""]
      interval: 10m
      timeout: 10s
      start_period: 10m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  files:
  letsencrypt:
  certbot-www:
